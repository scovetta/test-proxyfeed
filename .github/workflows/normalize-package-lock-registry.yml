name: Normalize package-lock registry URLs

# WARNING: This workflow auto-commits and auto-pushes changes without human review.
# Only run on trusted branches (main). Monitor for suspicious package-lock.json changes
# that could indicate supply chain manipulation.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Rewrite non-npmjs registry URLs in changed lockfiles
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t files < <(
              git ls-files -- 'package-lock.json' ':(glob)**/package-lock.json'
            )
          else
            mapfile -t files < <(
              git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
                'package-lock.json' ':(glob)**/package-lock.json'
            )
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No package-lock.json files changed."
            exit 0
          fi

          # List of regex patterns to normalize registry URLs
          # Each pattern matches a specific domain + path combination
          declare -a REGISTRY_PATTERNS=(
            's#https?://[^/]+\.pkgs\.visualstudio\.com/1es-public/_packaging/npm-public/npm/registry/#https://registry.npmjs.com/#g'
          )

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            
            # Apply registry normalization patterns
            for pattern in "${REGISTRY_PATTERNS[@]}"; do
              sed -E -i "$pattern" "$file"
            done
            
            # Validate that the file is still valid JSON after modifications
            if ! jq empty "$file" 2>/dev/null; then
              echo "ERROR: $file is not valid JSON after normalization"
              exit 1
            fi
          done

          if git diff --quiet -- "${files[@]}"; then
            echo "No URL normalization changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Normalize package-lock registry URLs"
          git push origin "HEAD:${GITHUB_REF_NAME}"