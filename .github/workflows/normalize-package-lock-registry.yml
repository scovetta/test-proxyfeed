name: Normalize package-lock registry URLs

on:
  push:

permissions:
  contents: write

jobs:
  normalize-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite non-npmjs registry URLs in changed lockfiles
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t files < <(git ls-files '**/package-lock.json')
          else
            mapfile -t files < <(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- '**/package-lock.json')
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "No package-lock.json files changed."
            exit 0
          fi

          for file in "${files[@]}"; do
            [ -f "$file" ] || continue
            perl -i -pe "s#https?://(?!registry\\.npmjs\\.com)([^/\\\"'[:space:]]+)#https://registry.npmjs.com#g" "$file"
          done

          if git diff --quiet -- "${files[@]}"; then
            echo "No URL normalization changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Normalize package-lock registry URLs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
